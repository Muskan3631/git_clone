name: System Report

on:
  push:

jobs:
  system-info:
    runs-on: ubuntu-latest

    steps:
      - name: Print OS and Kernel
        run: |
          echo "OS:"
          uname -o
          echo "Kernel:"
          uname -r

      - name: Print Free Disk Space
        run: |
          echo "Free disk space:"
          df -h

      - name: Print Current Date and Time
        run: |
          date

      - name: Install tree
        run: |
          sudo apt-get update
          sudo apt-get install -y tree

      - name: Display Home Directory
        run: |
          tree -L 2 "$HOME"

  tool-check:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Create report.json
        run: |
          echo '{"name":"runner","status":"success","type":"ubuntu"}' > report.json

      - name: Read report value
        run: |
          jq '.status' report.json

      - name: Print Versions
        run: |
          python3 --version
          git --version
          jq --version

      - name: Complete
        run: echo "Report complete"
        # System Report workflow
        